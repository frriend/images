       b:{img:'assets/q11-b.webp', head:'샐러드 5팩급이더라고요?', copy:'"걍 사과맛인데 식이섬유가 샐러드 5팩급이더라고요?" 찐 사과맛에 당류 ZERO! 애사비 특유 쿰쿰함 ZERO! · 100원딜', cta:'구매하기', days:7},
       correct:'a', note:"샐러드 5팩급 비유보다 두 병이면 식이섬유 채울 수 있다는 간편함을 강조한 점이 위닝 소재로 만들었습니다."},
    ];
    const TYPES = [
      {min:6, name:'마케터 끝판왕', desc:'오래 가는 소재의 신호를 정확히 읽었네요! 당신을 마케터 끝판왕으로 임명합니다.'},
      {min:5, name:'소재 감별사', desc:'오우, 꽤나 정확한데요? 소재 제작할 때 한마디 거들어도 되겠어요.'},
      {min:3, name:'반반 도박러', desc:'낭만 있게 직관과 근거를 반반씩 섞으시는군요. 오래 가는 소재의 공통점을 한 번만 정리하면 보는 눈이 빠르게 선명해질거에요.'},
      {min:0, name:'예산 탕진 장인', desc:'화려한 한 방에 마음이 갑니다. 눈에 띄는 쪽이 아닌 근거로 소재를 분석해보세요!'},
    ];

    // 브랜드별 위닝 소재 아카이브 링크 (결과 화면의 문제별 결과에서 사용)
    const REF = 'https://reference.snipit.im/reference/meta_library/';
    const WIN_REF = {
      '노트폴리오 Notefolio':'9299437',
      '쿠쿠':'6153087',
      '퓌 fwee':'8762913',
      '한끼통살':'7978286',
      '토스플레이스':'6783625',
      '달바 dAlba':'7840762',
      '라라스윗 Lalasweet':'7066246',
      '마미케어 mommycare':'6500953',
      '메디힐 Mediheal':'7822345',
      '클룹 CLOOP':'6554011',
      // 크런틴 CRUNTIN: 위닝 소재 링크 미제공 → 아래 MORE_URL로 대체
    };
    POOL.forEach(q => { const id = WIN_REF[q.brand]; if(id) q.win = REF + id; });

    // 매 판마다 POOL에서 ROUND개를 무작위로 뽑아 무작위 순서로 출제
    const ROUND = 6;
    function pickQuestions(){
      const a = POOL.slice();
      for(let i=a.length-1; i>0; i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
      return a.slice(0, ROUND);
    }
    let questions = pickQuestions();

    let index=0, score=0, streak=0, best=0, log=[], answered=false;
    const $=id=>document.getElementById(id);
    const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function show(id){ document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active')); $(id).classList.add('active'); window.scrollTo({top:0}); }
    function startGame(){ questions=pickQuestions(); index=0; score=0; streak=0; best=0; log=[]; renderQuestion(); show('game'); track('quiz_started',{brands:questions.map(q=>q.brand).join(', ')}); }

    function adCard(x,k){
      const ad=x[k];
      const inner = ad.video
        ? `<video src="${esc(ad.video)}"${ad.img?` poster="${esc(ad.img)}"`:''} autoplay muted loop playsinline preload="metadata" aria-label="${esc(ad.head)}"></video>`
        : ad.img ? `<img src="${esc(ad.img)}" alt="${esc(ad.head)}" loading="lazy">`
        : `<div style="display:grid;place-items:center;height:100%;padding:16px;font-weight:800;font-size:18px;word-break:keep-all">${esc(ad.head)}</div>`;
      return `<button class="choice" data-key="${k}" onclick="choose('${k}')">
        <div class="visual">${inner}</div>
        <div class="label">${k.toUpperCase()}</div>
      </button>`;
    }

    function renderQuestion(){
      answered=false; const x=questions[index];
      $('count').textContent=`${index+1} / ${questions.length}`;
      $('dots').innerHTML=questions.map((_,k)=>`<i class="${k<index?(log[k]?'ok':'no'):k===index?'cur':''}"></i>`).join('');
      $('brandname').textContent=x.brand.split(' ')[0];
      $('date').textContent=`게재일자: ${x.date}.`;
      const d=[x.a.days,x.b.days].sort((p,q)=>q-p); $('vs').textContent=`${d[0]}일 VS ${d[1]}일`;
      $('question').textContent='더 오래 게재된 위닝광고를 선택하세요'; $('question').className='question';
      $('reveal').className='reveal'; $('next').className='next';
      $('nextBtn').textContent=index===questions.length-1?'결과 보기':'다음 문제';
      $('choices').style.setProperty('--ar', x.ar || '1/1');
      $('choices').innerHTML=['a','b'].map(k=>adCard(x,k)).join('');
    }

    function choose(key){
      if(answered) return; answered=true;
      const x=questions[index], correct=key===x.correct; log[index]=correct;
      if(correct){score++; streak++; best=Math.max(best,streak);} else streak=0;
      track('question_answered',{question_index:index+1, brand:x.brand, choice:key.toUpperCase(), correct, correct_answer:x.correct.toUpperCase()});
      document.querySelectorAll('#choices .choice').forEach(el=>{const k=el.dataset.key; el.disabled=true; el.classList.add(k===x.correct?'correct':'wrong'); if(k===key)el.classList.add('selected'); el.querySelector('.label').textContent=`${k.toUpperCase()} · ${x[k].days}일`;});
      $('reveal').innerHTML=`
        <strong><em class="${correct?'':'bad'}">${correct?'정답':'오답'}</em>${correct?'정답이에요!':'정답은 '+x.correct.toUpperCase()+'예요.'}</strong>
        <div class="race" id="race">${['a','b'].map(k=>`<div class="row"><span>${k.toUpperCase()}</span><div class="bar ${k===x.correct?'top':''}" style="--w:${Math.max(18,x[k].days/Math.max(x.a.days,x.b.days)*100)}%"><i></i><span>${x[k].days}일 게재</span></div></div>`).join('')}</div>`;
      $('question').textContent=x.note; $('question').className='question note';
      $('reveal').className='reveal show'; $('next').className='next show';
      requestAnimationFrame(()=>requestAnimationFrame(()=>$('race').classList.add('go')));
    }

    function nextQuestion(){ if(index<questions.length-1){index++; renderQuestion(); window.scrollTo({top:0,behavior:'smooth'});} else showResult(); }

    function showResult(){
      const n=questions.length, pct=Math.round(score/n*100);
      const rank=[2,10,30,55,78,92,99][score]; // MVP: 임시 분포. 실서비스는 누적 응답 기반
      $('scoreText').textContent=`${score} / ${n}`; $('scoreBig').textContent=`${pct}점`;
      const top=100-rank; $('pct').textContent=`최다 연속 정답 ${best}`;
      $('rankText').innerHTML=`당신은 <b>상위 ${top}%</b>입니다`;
      const N=21, me=Math.round((100-top)/100*(N-1));
      $('dist').innerHTML=Array.from({length:N},(_,i)=>{const z=(i-(N-1)/2)/((N-1)/4.2); const h=Math.round(14+86*Math.exp(-z*z/2)); return `<i class="${i<me?'past':i===me?'me':''}" style="--h:${h}%"></i>`;}).join('');
      requestAnimationFrame(()=>requestAnimationFrame(()=>$('dist').classList.add('go')));
      const t=TYPES.find(t=>score>=t.min); $('typeName').textContent=t.name; $('typeDesc').textContent=t.desc;
      track('quiz_completed',{score, total:n, top_percent:top, result_type:t.name, best_streak:best});
      $('resultText').innerHTML = score===n ? '정확해요. 오래 살아남는 광고의 신호를 잘 읽고 있어요.<br>동료 마케터도 맞힐 수 있을까요?' : score>=n/2 ? '오래 살아남는 광고를 꽤 잘 짚어냈어요.<br>동료 마케터에게도 물어보세요.' : '첫인상만으로는 어렵죠.<br>그래서 실제 운영 데이터를 함께 봐야 합니다.';
      const missed=questions.filter((_,k)=>!log[k]).map(q=>q.brand);
      $('miss').innerHTML = missed.length ? `틀린 문제 <b>${esc(missed.join(', '))}</b> — 동료는 맞출 수 있을까요?` : '전부 맞추셨습니다. 이 결과 그대로 자랑하세요.';
      $('moreSub').textContent=`${questions.slice(0,3).map(q=>q.brand).join(', ')} 외 ${n-3}개 브랜드 · 게재기간·소재·카피까지`;
      $('moreLink').href=MORE_URL; $('moreLink').onclick=()=>track('more_ads_clicked',{score});
      $('review').innerHTML = `<h3>문제별 결과 <em>— 브랜드를 누르면 위닝 소재를 볼 수 있어요</em></h3>` + questions.map((q,k)=>`<a href="${esc(q.win||MORE_URL)}" target="_blank" rel="noopener" data-brand="${esc(q.brand)}"><span style="background:${log[k]?'var(--green)':'var(--red)'}">${log[k]?'○':'×'}</span><div>${esc(q.brand)}<br><small>${esc(q.cat)} · 정답 ${q.correct.toUpperCase()} (${q[q.correct].days}일)</small></div><small>→</small></a>`).join('');
      $('review').querySelectorAll('a').forEach(a=>a.onclick=()=>track('winning_ad_clicked',{brand:a.dataset.brand, score}));
      show('result');
    }

    async function shareGame(){
      const t=TYPES.find(t=>score>=t.min); track('share_clicked',{score, result_type:t.name});
      const text=`광고 생존 감별 테스트 ${score}/${questions.length}, 나는 "${t.name}" 마케터. 실제로 더 오래 게재된 광고, 당신도 맞혀보세요.`;
      // OS/브라우저 기본 공유 시트를 먼저 시도
      if(navigator.share){
        try{
          await navigator.share({title:document.title, text, url:location.href});
          track('share_completed',{score, result_type:t.name, method:'web_share'});
          return;
        }catch(e){
          if(e && e.name==='AbortError') return; // 사용자가 공유 시트를 닫음
        }
      }
      // 공유 시트를 쓸 수 없으면 링크 복사로 폴백
      const payload=`${text}\n${location.href}`;
      let ok=false;
      try{ await navigator.clipboard.writeText(payload); ok=true; }catch(e){}
      if(!ok){ try{ const ta=document.createElement('textarea'); ta.value=payload; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ok=document.execCommand('copy'); ta.remove(); }catch(e){} }
      if(ok) track('share_completed',{score, result_type:t.name, method:'clipboard'});
      const tt=$('toast'); tt.textContent=ok?'링크를 복사했어요':'복사에 실패했어요. 주소창의 링크를 직접 복사해주세요.'; tt.classList.add('on'); setTimeout(()=>tt.classList.remove('on'),1800);
    }
